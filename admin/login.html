<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Parish Portal | St. James Catholic Church</title>

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="login-logo">
                ✝
            </div>

            <h1>St. James Parish</h1>

            <p class="login-subtitle">
                Member & Administration Portal
            </p>

            <form id="loginForm">

                <div class="form-group" id="nameGroup" hidden>
                    <label for="name">Your Name</label>
                    <input type="text" id="name" autocomplete="name">
                </div>

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="At least 10 characters"
                        autocomplete="current-password"
                        minlength="10"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="admin-btn"
                >
                    <span id="submitLabel">Sign In</span>
                </button>

                <p id="loginMessage"></p>

            </form>

            <button type="button" class="back-link portal-mode" id="registerToggle">
                Create a member account
            </button>


            <a href="../index.html" class="back-link">
                ← Back to Parish Website
            </a>

        </div>

    </main>


    <script src="../css/js/admin.js"></script>

</body>

</html>
